<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>للصايمين اليوم فقط</title>
    <style>
        :root {
            --espresso: #3e2723;
            --mocha: #6f4e37;
            --latte: #c2b280;
            --cream: #f5f5dc;
            --success: #28a745;
        }

        body {
            background-color: var(--cream);
            color: var(--espresso);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column; /* ترتيب العناصر عمودياً */
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        #display-container {
            padding: 40px;
            border-radius: 30px;
            background: rgba(255, 255, 255, 0.3);
            box-shadow: 0 10px 30px rgba(62, 39, 35, 0.1);
            text-align: center;
            z-index: 1;
        }

        #c {
            font-size: 6rem;
            font-weight: bold;
            color: var(--mocha);
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
            transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        /* تنسيق شريط التقدم ليكون أنيقاً */
        progress {
            width: 300px;
            height: 20px;
            appearance: none;
            margin-top: 20px;
        }

        progress::-webkit-progress-bar {
            background-color: #eee;
            border-radius: 10px;
        }

        progress::-webkit-progress-value {
            background-color: var(--mocha);
            border-radius: 10px;
            transition: width 0.3s ease;
        }

        .pop { transform: scale(1.3); }

        .final-text {
            font-size: 3.5rem;
            color: var(--espresso);
            animation: fadeIn 0.8s ease-in-out forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.5); }
            to { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body>

<div id="display-container">
    <div id="c">7</div>
    <progress id="p" value="0" max="70"></progress>
</div>

<script>
    const display = document.getElementById("c");
    const progressBar = document.getElementById("p");
    
    let secondsLeft = 7;
    let progressValue = 0;
    const totalDuration = 7; // إجمالي الثواني

    // مؤقت العد التنازلي (كل ثانية)
    const timer = setInterval(() => {
        secondsLeft--;
        
        // تأثير الحركة (Pop)
        display.classList.remove('pop');
        void display.offsetWidth; 
        display.classList.add('pop');

        if (secondsLeft <= 0) {
            clearInterval(timer);
            clearInterval(progressInterval);
            
            // الحالة النهائية
            progressBar.value = 70;
            display.innerHTML = "شو فطوركم اليوم؟ ☕";
            display.className = "final-text";
            
            // حركة إضافية: إخفاء شريط التقدم عند النهاية
            progressBar.style.display = "none";
        } else {
            display.innerText = secondsLeft;
        }
    }, 1000);

    // مؤقت شريط التقدم (سلس جداً - يتحدث كل 100 مللي ثانية)
    const progressInterval = setInterval(() => {
        progressValue += 1;
        progressBar.value = progressValue;
        
        if (progressValue >= 70) {
            clearInterval(progressInterval);
        }
    }, 100);
</script>

</body>
</html>
