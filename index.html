<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>brainrot</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        body { 
            font-family: 'Cairo', sans-serif; /* تغيير الخط لخط كايرو */
            text-align: center; 
            margin-top: 80px; 
            background-color: #f4f7f6;
            font-size: 1.2rem; /* تكبير الخط العام */
        }

        h3 {
            font-size: 2.5rem; /* تكبير حجم السؤال */
            color: #333;
            margin-bottom: 30px;
        }

        input { 
            padding: 15px; 
            font-family: 'Cairo', sans-serif;
            font-size: 1.1rem;
            border-radius: 10px; 
            border: 2px solid #ddd; 
            width: 250px;
            outline: none;
            transition: border 0.3s;
        }

        input:focus {
            border-color: #28a745;
        }

        button { 
            padding: 15px 30px; 
            font-family: 'Cairo', sans-serif;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer; 
            background-color: #28a745; 
            color: white; 
            border: none; 
            border-radius: 10px; 
            margin-right: 10px;
            transition: background 0.3s;
        }

        button:hover {
            background-color: #218838;
        }

        #resultArea { 
            margin-top: 30px; 
            font-size: 1.5rem; /* تكبير خط النتيجة */
        }

        video { 
            margin-top: 20px; 
            border-radius: 15px; 
            box-shadow: 0 10px 20px rgba(0,0,0,0.15); 
        }

        .error-text { color: #d9534f; font-weight: bold; }
        .success-text { color: #28a745; font-weight: bold; }
    </style>
</head>
<body>

    <h3>كم ناتج: 2 + 2 ؟</h3>
    
    <input type="number" id="answerInput" placeholder="اكتب إجابتك هنا">
    <button onclick="checkAnswer()">تحقق من الإجابة</button>

    <div id="resultArea"></div>

    <script>
        function checkAnswer() {
            var userAnswer = document.getElementById("answerInput").value;
            var resultArea = document.getElementById("resultArea");

            if (userAnswer == 3) {
                resultArea.innerHTML = `
                    <p class="success-text">من فضلك بطل مخدرات.... شو فطوركم اليوم؟</p>
                    <video width="400" height="300" controls>
                      <source src="assets/video.mp4" type="video/mp4">
                      متصفحك لا يدعم تشغيل الفيديو.
                    </video>
                    
                `;
            } else {
                resultArea.innerHTML = `<p class="error-text">غش: الجواب الصحيح ناقص واحد</p>`;
            }
        }
    </script>

</body>

</html>
