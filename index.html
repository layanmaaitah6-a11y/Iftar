<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>chase</title>

<style>
    :root{
        --bg:#f4f6f9;
        --danger:#B58B82;
        --success:#2ed573;
        --info:#1e90ff;
    }

    *{
        box-sizing:border-box;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    }

    body{
        margin:0;
        height:100vh;
        display:flex;
        justify-content:center;
        align-items:center;
        background:linear-gradient(135deg,#eef2f7,#dfe6ee);
        overflow:hidden;
        touch-action:none;
    }

    button{
        border:none;
        cursor:pointer;
        font-weight:600;
        transition:all .25s ease;
    }

    /* الزر الهارب */
    #b{
        position:absolute;
        padding:15px 28px;
        font-size:1.1rem;
        background:var(--danger);
        color:#fff;
        border-radius:50px;
        box-shadow:0 10px 25px rgba(0,0,0,.15);
        white-space:nowrap;
    }

    #b:hover{
        transform:scale(1.05);
        box-shadow:0 12px 30px rgba(0,0,0,.2);
    }

    /* الزر الثابت */
    #finalBtn{
        display:none;
        padding:20px 45px;
        font-size:1.3rem;
        background:var(--success);
        color:#fff;
        border-radius:16px;
        box-shadow:0 12px 30px rgba(0,0,0,.12);
    }

    #finalBtn:hover{
        transform:translateY(-3px);
        box-shadow:0 16px 35px rgba(0,0,0,.18);
    }
</style>
</head>

<body>

<button id="b">اضغطني</button>
<button id="finalBtn">أنا نفسي أسمع كلمة بيبي</button>

<script>
const b = document.getElementById("b");
const finalBtn = document.getElementById("finalBtn");

let moves = 0;
const maxMoves = 6;

const messages = [
    "فاتك!",
    "كمان مرة",
    "آسف",
    "خلص بمزح",
	 "آخر مرة جد",
    "دعابة يا زلمة"
   
];

function escape(e){
    if(moves < maxMoves){

        if(e.type === "touchstart") e.preventDefault();

        const padding = 20;
        const maxX = window.innerWidth - b.offsetWidth - padding;
        const maxY = window.innerHeight - b.offsetHeight - padding;

        const randomX = Math.random() * maxX;
        const randomY = Math.random() * maxY;

        b.style.left = Math.max(10, randomX) + "px";
        b.style.top = Math.max(10, randomY) + "px";

        b.innerText = messages[moves];
        moves++;

    }else{
        b.innerText = "خلص تعبت";
        b.style.backgroundColor = "#ff7f50";
        b.style.cursor = "pointer";
    }
}

b.addEventListener("mouseover", escape);
b.addEventListener("touchstart", escape);

b.addEventListener("click", () => {
    if(moves >= maxMoves){
        b.style.display = "none";
        finalBtn.style.display = "block";
    }
});

finalBtn.addEventListener("click", () => {
    finalBtn.innerText = "شو فطوركم اليوم؟ 🍳";
	finalBtn.style.color = "#000000";
    finalBtn.style.backgroundColor = "#FFFFFF";
});
</script>

</body>
</html>
